<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumino 数据管理平台</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">Lumino</p>
          <h1 id="pageTitle">数据资产工作台</h1>
          <p class="topbar-text">上传、预览、下载和管理本地数据文件，元数据写入 PostgreSQL。</p>
        </div>
        <div class="topbar-actions">
          <span class="system-status"><span class="status-dot"></span>PostgreSQL</span>
          <button id="refreshButton" class="button secondary" type="button">刷新</button>
          <a class="button primary" href="#uploadForm">上传</a>
        </div>
      </header>

      <section class="metric-strip" aria-label="数据资产概览">
        <article>
          <span>数据集</span>
          <strong id="summaryDatasets">0</strong>
        </article>
        <article>
          <span>总行数</span>
          <strong id="summaryRows">0</strong>
        </article>
        <article>
          <span>总字段</span>
          <strong id="summaryColumns">0</strong>
        </article>
        <article>
          <span>文件体积</span>
          <strong id="summarySize">0 B</strong>
        </article>
      </section>

      <section class="workspace">
        <form id="uploadForm" class="panel upload-panel">
          <div class="panel-header">
            <div>
              <p class="section-kicker">Upload</p>
              <h2>上传数据</h2>
            </div>
            <p>CSV 自动生成字段、样例和数值统计；其他格式作为原始文件管理。</p>
          </div>

          <label class="field">
            <span>数据名称</span>
            <input name="name" type="text" placeholder="例如：五月销售明细" />
          </label>

          <label class="field">
            <span>描述</span>
            <textarea name="description" rows="3" placeholder="数据来源、口径或用途"></textarea>
          </label>

          <label class="file-drop" for="fileInput">
            <input id="fileInput" name="file" type="file" required />
            <span class="file-drop-title">选择文件</span>
            <span id="selectedFileName" class="file-drop-meta">单文件最大 100MB，CSV 支持预览</span>
          </label>

          <button id="uploadButton" class="button primary block" type="submit">上传数据</button>
          <p id="uploadStatus" class="status-message" role="status" aria-live="polite"></p>
        </form>

        <section class="panel list-panel" aria-labelledby="listTitle">
          <div class="panel-header inline">
            <div>
              <p class="section-kicker">Datasets</p>
              <h2 id="listTitle">数据资产</h2>
            </div>
            <p id="datasetCount">0 个数据集</p>
          </div>
          <div id="datasetList" class="dataset-list"></div>
        </section>
      </section>

      <section id="detailPanel" class="panel detail-panel hidden" aria-labelledby="detailTitle">
        <div class="panel-header inline detail-heading">
          <div>
            <p class="section-kicker">Detail</p>
            <h2 id="detailTitle">数据详情</h2>
            <p id="detailMeta"></p>
          </div>
          <a id="downloadLink" class="button secondary" href="#">下载原始文件</a>
        </div>
        <div id="profileGrid" class="profile-grid"></div>
        <div class="preview-header">
          <h3>样例数据</h3>
          <p>最多展示前 50 行</p>
        </div>
        <div class="table-wrap">
          <table id="previewTable"></table>
        </div>
      </section>
    </main>
    <script src="/web/app.js"></script>
  </body>
</html>
